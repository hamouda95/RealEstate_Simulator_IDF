<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon foyer : aides et capacité d'emprunt</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <header>
    <h1>Mon foyer : aides et capacité d'emprunt</h1>
    <div class="bar"></div>
    <p class="sub">Les aides auxquelles votre foyer a droit pour acheter un appartement, et le prix maximal que vous pouvez financer.</p>
    <p class="lien"><a href="{{ url_for('index') }}">← Retour au comparateur</a></p>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2>Votre situation</h2>
      
      <div class="f">
        <label for="revenu_fiscal">Revenu fiscal de référence N-2 (€)</label>
        <input type="number" id="revenu_fiscal" min="0" max="200000" step="1000" value="45000">
      </div>

      <div class="f">
        <label for="nb_personnes">Nombre de personnes dans le foyer</label>
        <input type="number" id="nb_personnes" min="1" max="10" step="1" value="2">
      </div>

      <div class="f full">
        <label for="zone">Zone géographique</label>
        <select id="zone">
          <option value="A">Zone A (Paris, Île-de-France, grandes métropoles)</option>
          <option value="Abis" selected>Zone A bis (Paris et 76 communes IDF)</option>
          <option value="B1">Zone B1 (Agglomérations >250 000 hab.)</option>
          <option value="B2">Zone B2 (Agglomérations >50 000 hab.)</option>
          <option value="C">Zone C (Reste du territoire)</option>
        </select>
      </div>

      <div class="f full">
        <label for="type_logement">Type de logement</label>
        <select id="type_logement">
          <option value="vefa" selected>Neuf en immeuble collectif (VEFA appartement)</option>
          <option value="neuf">Neuf individuel (maison)</option>
          <option value="ancien">Logement ancien avec travaux</option>
        </select>
      </div>

      <div class="f">
        <label for="prix">Prix du bien (€)</label>
        <input type="number" id="prix" min="50000" max="1000000" step="1000" value="300000">
      </div>
      <div class="f">
        <label for="apport">Apport personnel (€)</label>
        <input type="number" id="apport" min="0" max="1000000" step="1000" value="30000">
      </div>

      <div class="f full">
        <label>
          <input type="checkbox" id="salarie"> Salarié d'entreprise ≥10 salariés (Action Logement)
        </label>
      </div>

      <h2>Revenus et crédit</h2>
      <div class="f">
        <label for="revenus">Revenus nets mensuels du foyer avant impôt (€)</label>
        <input type="number" id="revenus" min="0" max="100000" step="100" value="5000">
      </div>
      <div class="f">
        <label for="charges">Mensualités de crédits en cours (€)</label>
        <input type="number" id="charges" min="0" max="50000" step="10" value="0">
      </div>
      <div class="f">
        <label for="taux">Taux du prêt principal (%)</label>
        <input type="number" id="taux" min="0" max="10" step="0.05" value="3.5">
      </div>
      <div class="f">
        <label for="duree">Durée (ans)</label>
        <input type="number" id="duree" min="5" max="30" step="1" value="25">
      </div>
      <div class="f">
        <label for="ass">Assurance emprunteur (%/an du capital)</label>
        <input type="number" id="ass" min="0" max="2" step="0.01" value="0.30">
      </div>
      <div class="f">
        <label for="garantie">Garantie (% du prêt)</label>
        <input type="number" id="garantie" min="0" max="3" step="0.05" value="1.0">
      </div>
      <div class="f">
        <label for="frais_dossier">Frais de dossier (€)</label>
        <input type="number" id="frais_dossier" min="0" max="5000" step="50" value="1000">
      </div>

      <button id="tester">Calculer</button>
    </aside>

    <section class="results">
      <div id="resultats"></div>
      <div id="loading" style="display:none;">
        <p>Calcul en cours...</p>
      </div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

async function testerEligibilite() {
  const params = {
    revenu_fiscal: parseFloat($('revenu_fiscal').value) || 0,
    nb_personnes: parseInt($('nb_personnes').value) || 1,
    zone: $('zone').value,
    type_logement: $('type_logement').value,
    prix: parseFloat($('prix').value) || 0,
    salarie: $('salarie').checked,
    apport: parseFloat($('apport').value) || 0,
    revenus: parseFloat($('revenus').value) || 0,
    charges: parseFloat($('charges').value) || 0,
    taux: parseFloat($('taux').value) || 0,
    duree: parseFloat($('duree').value) || 25,
    ass: parseFloat($('ass').value) || 0,
    garantie: parseFloat($('garantie').value) || 0,
    frais_dossier: parseFloat($('frais_dossier').value) || 0,
    etat: $('type_logement').value === 'ancien' ? 'ancien' : 'neuf',
  };
  params.prix_vise = params.prix;

  $('loading').style.display = 'block';
  $('resultats').innerHTML = '';

  try {
    const response = await fetch('/api/eligibilite', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(params),
    });
    const data = await response.json();
    if (!response.ok || data.success === false) throw new Error(data.error || "service indisponible");
    const rc = await fetch('/api/capacite', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(params)});
    const cap = await rc.json();
    if (!rc.ok || cap.success === false) throw new Error(cap.error || "service indisponible");
    afficherResultats(data);
    $('resultats').insertAdjacentHTML('afterbegin', afficherCapacite(cap));
  } catch (error) {
    $('resultats').innerHTML = `<p class="warn">Calcul impossible : ${error.message}. Vérifiez les champs puis réessayez.</p>`;
  } finally {
    $('loading').style.display = 'none';
  }
}

const eur = x => Math.round(x).toLocaleString('fr-FR') + ' €';
const pct = x => x.toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' %';
function afficherCapacite(c) {
  let h = `<h2>Capacité d'emprunt</h2><div class="card ${c.prix_max > 0 ? 'ok' : 'ko'}">
    <h3>Prix maximal du logement : ${eur(c.prix_max)}</h3>
    <p>Mensualité maximale : <strong>${eur(c.budget_mensuel)}</strong> (${pct(c.taux_effort_max)} de ${eur(c.revenus)} − ${eur(c.charges)} de crédits en cours)<br>
    Financement : prêt principal <strong>${eur(c.pret_principal)}</strong> + PTZ ${eur(c.ptz)}${c.ptz ? ` (${c.ptz_duree} ans dont ${c.ptz_differe} de différé)` : ''} + Action Logement ${eur(c.al)} + apport ${eur(c.apport)}<br>
    Frais inclus : ${eur(c.frais_total)} (notaire ${eur(c.frais_notaire)}, garantie ${eur(c.frais_garantie)}, dossier ${eur(c.frais_dossier)})<br>
    Mensualité totale ${eur(c.mensualite)} · taux d'effort ${pct(c.taux_effort)} · reste à vivre <strong>${eur(c.reste_a_vivre)}</strong>/mois</p>`;
  if (c.projet) {
    const p = c.projet;
    h += `<p class="${p.financable ? 'ok' : 'warn'}">Votre projet à ${eur(p.prix)} : mensualité ${eur(p.mensualite)}, taux d'effort ${p.taux_effort === null ? '–' : pct(p.taux_effort)} → ${p.financable ? 'finançable' : 'au-delà de 35 %, refus probable'}.</p>`;
  }
  h += c.alertes.map(a => `<p class="warn">${a}</p>`).join('');
  h += `<small class="note">${c.source}. Cumul des mensualités sans lissage, assurance sur le capital initial. Les banques peuvent déroger pour 20 % de leurs dossiers.</small></div>`;
  return h;
}

function afficherResultats(aides) {
  let html = '<h2>Aides</h2>';

  for (const [nom, aide] of Object.entries(aides)) {
    if (aide.eligible) {
      html += `<div class="card ok">
        <h3>✓ ${nom}</h3>
        <p>`;
      
      if (aide.montant_max) {
        html += `<strong>Montant maximal: ${aide.montant_max.toLocaleString('fr-FR')} €</strong><br>`;
      }
      if (aide.quotite) {
        html += `Quotité finançable: ${aide.quotite}%<br>`;
      }
      if (aide.duree_max) {
        html += `Durée maximale: ${aide.duree_max} ans${aide.differe !== undefined ? ` dont ${aide.differe} ans de différé` : ''}<br>`;
      }
      if (aide.cout_retenu) {
        html += `Coût de l'opération retenu: ${aide.cout_retenu.toLocaleString('fr-FR')} € · revenu retenu: ${aide.revenu_retenu.toLocaleString('fr-FR')} € (coef. familial ${aide.coef_familial})<br>`;
      }
      if (aide.tranche) {
        html += `Tranche: ${aide.tranche}<br>`;
      }
      if (aide.taux) {
        html += `Taux: ${aide.taux}%<br>`;
      }
      if (aide.plafond_zone) {
        html += `<small>Plafond zone: ${aide.plafond_zone.toLocaleString('fr-FR')} € (ratio: ${aide.ratio_revenu})</small><br>`;
      }
      if (aide.avantages) {
        html += `<ul>${aide.avantages.map(a => `<li>${a}</li>`).join('')}</ul>`;
      }
      if (aide.condition) {
        html += `<small>${aide.condition}</small><br>`;
      }
      if (aide.source) {
        html += `<small class="note">Source : ${aide.source}</small>`;
      }
      
      html += `</p></div>`;
    } else {
      html += `<div class="card ko">
        <h3>✗ ${nom}</h3>
        <p><small>${aide.raison}</small></p>
      </div>`;
    }
  }

  $('resultats').innerHTML = html;
}

$('tester').addEventListener('click', testerEligibilite);
</script>
</body>
</html>
