services:
  - type: web
    name: realestate-simulator-idf
    runtime: python
    plan: free
    rootDir: dashboard_vefa
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
